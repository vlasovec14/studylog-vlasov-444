{% if form.non_field_errors %}<div class="errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-label="обязательное поле"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div class="errors" role="alert">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
